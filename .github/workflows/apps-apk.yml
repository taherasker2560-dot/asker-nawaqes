# Builds «مفتاح التطبيقات», the owner's small Android app (apps-android/): the system's «تطبيقات الشغل» buttons hand it a package
# (askerapps://open?pkg=…) and it starts that app with ONE tap (a web page cannot start another app's own screen by itself).
# Tested here: the plain rule (JUnit) and a real Android emulator (the link opens the asked app; the REAL Chrome tap does the same).
# The finished APK is attached to a pre-release called «apps-build» as asker-apps.apk: the system's download link points to it.
name: apps-apk
on:
  push:
    branches: [main, 'apps-**']
    paths:
      - 'apps-android/**'
      - 'ar/work-apps.js'
      - '.github/workflows/apps-apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'   # weekly: touch the signing key's cache so GitHub never evicts it (a new key would stop the app from updating in place)
permissions:
  contents: write
concurrency:
  group: apps-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        id: ks
        with:
          path: ~/apps.keystore
          key: apps-keystore-v1
      - run: echo "signing key cache hit = ${{ steps.ks.outputs.cache-hit }}"
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Signing key (cached)
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/apps.keystore
          key: apps-keystore-v1
      - name: Make the signing key
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore ~/apps.keystore -storepass apps-sideload -keypass apps-sideload -alias apps -keyalg RSA -keysize 2048 -validity 9125 -dname "CN=Asker Pharmacy Apps Key"
      - name: Test and build
        working-directory: apps-android
        env:
          APPS_KEYSTORE: /home/runner/apps.keystore
          APPS_KS_PASS: apps-sideload
        run: gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
      - name: Show the errors (on failure)
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|What went wrong|Could not|Unresolved|AAPT' /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: What is inside the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=apps-android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"; sha256sum "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|uses-permission|launchable-activity|application-label:" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: apps-apk-release
          path: apps-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apps-apk-debug
          path: apps-android/app/build/outputs/apk/debug/app-debug.apk
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apps-apk-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright
        run: npm install --no-save --prefix apps-android/ci playwright@1.48.2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash apps-android/ci/smoke.sh apk/app-debug.apk
            node apps-android/ci/chrome.cjs
  publish:
    needs: [build, smoke]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apps-apk-release
          path: apk
      - name: Attach to the pre-release «apps-build»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/app-release.apk asker-apps.apk
          sha256sum asker-apps.apk
          gh release view apps-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create apps-build --repo "$GITHUB_REPOSITORY" --prerelease --title "Apps key (owner)" --notes "«مفتاح التطبيقات»: the owner's Android helper that opens his work apps from the system with one tap. Built and tested by the apps-apk workflow; the asset is replaced by each build."
          gh release upload apps-build asker-apps.apk --clobber --repo "$GITHUB_REPOSITORY"
