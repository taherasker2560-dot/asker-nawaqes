# Runs every unit and browser test on each push and pull request. Nothing here deploys or touches Supabase.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # 25, not 15 (2026-11-19): the whole suite takes about 12 minutes and «playwright install --with-deps» alone took 6-8 minutes on some
    # runs (apt), so good branches were cancelled at 15 minutes and had to be run again
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
