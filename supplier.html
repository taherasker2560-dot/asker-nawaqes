<body>
  <main class="sp" id="spApp">
    <header class="sp-head">
      <img src="icons/arabic-192.png?v=logo2" alt="" width="40" height="40" />
      <div><div class="sp-ph">صيدلية عسكر</div><h1 id="spTitle">كشف حساب شركتكم</h1></div>
    </header>
    <p class="sp-note sp-preview" id="spPreview" hidden>ده حساب الشركة زي ما هتشوفه. على موبايلك مش بيتحفظ ولا بيتثبت.</p>
    <p class="sp-status" id="spStatus">بيجيب الحساب…</p>
    <section id="spBody" hidden>
      <div class="sp-bal" id="spBal"></div>
      <div class="sp-range noprint">
        <label>من <input id="spFrom" type="date" /></label>
        <label>لحد <input id="spTo" type="date" /></label>
      </div>
      <div class="sp-chips noprint" role="group" aria-label="نوع الحركة">
        <button type="button" class="chip on" data-sp-kind="">الكل</button>
        <button type="button" class="chip" data-sp-kind="purchase">الفواتير</button>
        <button type="button" class="chip" data-sp-kind="return">المرتجعات</button>
        <button type="button" class="chip" data-sp-kind="payment">المدفوعات</button>
      </div>
      <div class="sp-sum" id="spSum"></div>
      <p class="sp-status" id="spListStatus"></p>
      <div id="spMoves"></div>
      <button type="button" class="sp-more noprint" id="spMore" hidden>حركة أقدم</button>
      <div class="sp-btns noprint">
        <button type="button" class="sp-btn fill" id="spPrint">🖨 طباعة / حفظ الكشف PDF</button>
        <button type="button" class="sp-btn" id="spInstall" hidden>📲 ثبّت التطبيق</button>
      </div>
      <p class="sp-note noprint" id="spGuide" hidden></p>
      <p class="sp-note" id="spFoot"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
