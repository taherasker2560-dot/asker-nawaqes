<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASKER — اختبار قراءة صور الوارد</title>
<style>body{font:16px system-ui;background:#f3f6fb;color:#172033;margin:0}main{max-width:740px;margin:auto;padding:20px}header{background:#123d8c;color:white;padding:22px}h1{font-size:22px;margin:0}.card{background:white;padding:18px;border-radius:14px;margin:14px 0}button,select,input,textarea{font:inherit}button{background:#123d8c;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;box-sizing:border-box;min-height:240px;margin-top:12px}label{display:block;margin:12px 0}.hint{color:#5d687a;font-size:14px}#status{white-space:pre-wrap}</style></head>
<body><header><h1>ASKER — معمل اختبار OCR</h1>قراءة أسماء الأصناف فقط — بدون اتصال بقاعدة البيانات</header><main><section class="card"><p><strong>صفحة اختبار مستقلة.</strong> الصور تُقرأ داخل متصفحك. لا يوجد Supabase ولا حفظ وارد ولا تسجيل دخول.</p>
<label>اختار صورتين من الوارد <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
<label><input id="crop" type="checkbox"> محاولة استبعاد عمود السعر بالفاصل المكتشف تلقائيًا</label>
<label>لغة القراءة <select id="lang"><option value="ara">عربي</option><option value="ara+eng">عربي وإنجليزي</option></select></label>
<button id="run">استخراج الأسماء</button> <button id="copy" type="button">نسخ النتائج</button>
<p id="status" role="status" class="hint">جاهز للاختبار.</p><textarea id="output" dir="rtl" placeholder="هتظهر الأسماء هنا للمراجعة"></textarea></section></main>
<script src="vendor/tesseract-6.0.1.min.js"></script><script>
const $=id=>document.getElementById(id);let busy=false;
function detect(ctx,w,h){const d=ctx.getImageData(0,0,w,h).data,brightness=(x,y)=>{const i=(y*w+x)*4;return(d[i]+d[i+1]+d[i+2])/3};let best=-1,score=0;for(let x=Math.floor(w*.62);x<Math.floor(w*.9);x++){let hits=0,total=0;for(let y=Math.floor(h*.1);y<Math.floor(h*.9);y+=6){const c=brightness(x,y);if(c>190&&brightness(x-3,y)-c>3&&brightness(x+3,y)-c>3)hits++;total++}if(hits/total>score){score=hits/total;best=x}}return score>=.85?best:-1}
async function prepare(file,crop){const bmp=await createImageBitmap(file);try{if(bmp.width*bmp.height>24000000)throw Error('الصورة كبيرة جدًا');let width=bmp.width;if(crop){const p=document.createElement('canvas');p.width=bmp.width;p.height=bmp.height;const c=p.getContext('2d',{willReadFrequently:true});c.drawImage(bmp,0,0);const divider=detect(c,p.width,p.height);if(divider>0)width=divider}const scale=Math.min(2,4000/Math.max(width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.round(width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,width,bmp.height,0,0,canvas.width,canvas.height);return canvas}finally{bmp.close()}}
$('run').onclick=async()=>{if(busy)return;const files=[...$('photos').files];if(!files.length||files.length>2){$('status').textContent='اختار صورة أو صورتين فقط.';return}busy=true;$('run').disabled=true;let worker;const out=[];try{if(!window.Tesseract)throw Error('مكتبة القراءة لم تُحمّل');$('status').textContent='تحميل قارئ الصور...';worker=await Tesseract.createWorker($('lang').value,1,{logger:m=>{if(m.status==='recognizing text')$('status').textContent='جاري القراءة '+Math.round((m.progress||0)*100)+'%'}});for(let i=0;i<files.length;i++){try{const canvas=await prepare(files[i],$('crop').checked);const r=await worker.recognize(canvas);out.push('--- '+files[i].name+' ---\n'+r.data.text)}catch(e){out.push('--- '+files[i].name+' ---\nفشلت القراءة: '+e.message)}$('output').value=out.join('\n\n');$('status').textContent='تمت معالجة '+(i+1)+' من '+files.length+' صورة'}$('status').textContent='اكتمل الاختبار. راجع الأسماء: النص خام وقد يتضمن أسعارًا أو أخطاء OCR.'}catch(e){$('status').textContent='تعذر الاختبار: '+e.message}finally{if(worker)await worker.terminate();busy=false;$('run').disabled=false}};
$('copy').onclick=()=>navigator.clipboard.writeText($('output').value).then(()=>$('status').textContent='تم نسخ النتائج').catch(()=>$('status').textContent='حدد النص وانسخه يدويًا');
</script></body></html>
